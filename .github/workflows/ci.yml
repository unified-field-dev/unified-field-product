# PR / merge gate aligned with docs/VERIFICATION.md Layer 1 + documentation gates.
# Path patches and lepton path deps assume the Unified Field operator checkout layout; CI
# checks this repo out under that path and shallow-clones siblings.
#
# Pull requests: `pull_request` runs for branches on unified-field-dev/{repo}.
# Fork PRs (deathbreakfast → uf-dev) need either (a) push the branch to uf-dev and
# open a same-repo PR, or (b) repo Settings → Actions → allow workflows from fork PRs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-uf-product
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"
  UF_ROOT: unified-field
  PRODUCT_WD: unified-field/L2-product-platform/unified-field-product

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.PRODUCT_WD }}
      - name: Checkout lepton (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton
          path: ${{ env.UF_ROOT }}/L1-host-stack-kits/lepton
          ssh-key: ${{ secrets.LEPTON_CLONE_SSH_KEY }}
      - name: Checkout gauge (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deathbreakfast/gauge
          path: ${{ env.UF_ROOT }}/L3-zone-products/gauge
          ssh-key: ${{ secrets.GAUGE_CLONE_SSH_KEY }}
      - name: Checkout tag (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deathbreakfast/tag
          path: ${{ env.UF_ROOT }}/L3-zone-products/tag
          ssh-key: ${{ secrets.TAG_CLONE_SSH_KEY }}
      - name: Checkout record-history (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deathbreakfast/record-history
          path: ${{ env.UF_ROOT }}/L3-zone-products/record-history
          ssh-key: ${{ secrets.RECORD_HISTORY_CLONE_SSH_KEY }}
      - name: Checkout uf-notifications (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/uf-notifications
          path: ${{ env.UF_ROOT }}/L2-product-platform/uf-notifications
          ssh-key: ${{ secrets.UF_NOTIFICATIONS_CLONE_SSH_KEY }}
      - name: Checkout lepton-uf-app (private path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: unified-field-dev/lepton-uf-app
          path: ${{ env.UF_ROOT }}/L2-product-platform/lepton-uf-app
          ssh-key: ${{ secrets.LEPTON_UF_APP_CLONE_SSH_KEY }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2" org="${3:-unified-field-dev}"
            git clone --depth 1 "https://github.com/${org}/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon" unified-field-dev
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros" unified-field-dev
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity" unified-field-dev
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check (Layer 1 packages)
        working-directory: ${{ env.PRODUCT_WD }}
        run: >
          cargo fmt
          -p uf-product-macros -p uf-codegen -p uf-apps -p uf-search-core
          -- --check

