[workspace]
resolver = "2"
members = [
    "uf-product-macros",
    "uf-help-macros",
    "uf-codegen",
    "uf-search-core",
    "uf-product",
    "uf-integrations",
    "uf-help",
    "uf-appearance",
    "uf-apps",
    "uf-welcome",
    "uf-component-preview",
    "examples/shell-chrome-host",
    "examples/component-preview-host",
    "uf-product-ui-e2e",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Sean O'Rourke"]
repository = "https://github.com/unified-field-dev/unified-field-product"
homepage = "https://github.com/unified-field-dev/unified-field-product"
documentation = "https://github.com/unified-field-dev/unified-field-product"

[workspace.lints.rust]
missing_docs = "deny"
# leptos-lints (Dylint) names are unknown to rustc/clippy alone
unknown_lints = "allow"
leptos_print_stdout = "deny"
leptos_event_target = "deny"
leptos_event_target_value = "deny"
leptos_unscoped_spawn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Newer nightly pedantic lint; keep existing assert style in tests.
assert_is_empty = "allow"
empty_enums = "allow"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
doc_markdown = "allow"
use_self = "allow"
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
match_wildcard_for_single_variants = "allow"
items_after_statements = "allow"
redundant_clone = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
implicit_clone = "allow"
trait_duplication_in_bounds = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
unnecessary_trailing_comma = "allow"
elidable_lifetime_names = "allow"
trivially_copy_pass_by_ref = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
ref_option = "allow"
manual_let_else = "allow"
cognitive_complexity = "allow"
match_same_arms = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
unnested_or_patterns = "allow"
too_long_first_doc_paragraph = "allow"
assigning_clones = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
collection_is_never_read = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
fn_params_excessive_bools = "allow"
semicolon_if_nothing_returned = "allow"
struct_field_names = "allow"
redundant_pub_crate = "allow"
large_types_passed_by_value = "allow"
enum_glob_use = "allow"
unreadable_literal = "allow"

[workspace.dependencies]
# Leptos
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }

# Zone A Orbital UI (crates.io)
orbital-zone-a = { package = "orbital-ui", version = "0.1.4", default-features = false }
orbital-macros = { version = "0.1.5" }
orbital-shell = { version = "0.1.4", default-features = false }
orbital-core-components = { version = "0.1.4" }
orbital-base-components = { version = "0.1.4" }
orbital-primitives = { version = "0.1.4", default-features = false }
orbital-theme = { version = "0.1.4", default-features = false }
orbital-paging = { version = "0.1.4", default-features = false }
orbital-datatable = { version = "0.1.4", default-features = false }
orbital-date-pickers = { version = "0.1.4", default-features = false }
orbital-charts = { version = "0.1.4", default-features = false }
orbital-tree = { version = "0.1.4", default-features = false }
orbital-scheduler = { version = "0.1.4", default-features = false }

# Platform — crates.io for published cores
valence = { package = "uf-valence", version = "0.1.5", default-features = false, features = ["mem", "sqlite"] }
valence-codegen = { package = "uf-valence-codegen", version = "0.1.5" }
higgs = { git = "https://github.com/deathbreakfast/higgs", branch = "main", default-features = false }
higgs-host = { git = "https://github.com/deathbreakfast/higgs", branch = "main", package = "higgs-host", default-features = false }
higgs-identity = { git = "https://github.com/deathbreakfast/higgs", branch = "main", package = "higgs-identity" }
lepton-identity = { path = "../../L1-host-stack-kits/lepton/lepton-identity", default-features = false, features = ["db-sqlite"] }
lepton-host-adapter = { path = "../../L1-host-stack-kits/lepton/lepton-host-adapter", default-features = false, features = ["db-sqlite"] }
quark = { package = "uf-quark", version = "0.1.3" }
inventory = "0.3"

# Spectra (crates.io)
spectra = { package = "uf-spectra", version = "0.1.3", default-features = false }
spectra-core = { package = "uf-spectra-core", version = "0.1.3" }

# Photon (crates.io)
photon = { package = "uf-photon", path = "../../L0-upstream-cores/photon/photon", default-features = false }
photon-backend = { path = "../../L0-upstream-cores/photon/photon-backend", default-features = false }
photon-runtime = { path = "../../L0-upstream-cores/photon/photon-runtime", default-features = false }
photon-leptos = { path = "../../L1-host-stack-kits/photon-leptos/photon-leptos", default-features = false }
photon-axum = { path = "../../L1-host-stack-kits/photon-leptos/photon-axum", default-features = false }

# Permission platform types + host-pluggable backend; no L3 gauge compile edge.

# In-repo
uf-product = { path = "uf-product" }
uf-integrations = { path = "uf-integrations" }
uf-help = { path = "uf-help" }
uf-help-macros = { path = "uf-help-macros" }
uf-appearance = { path = "uf-appearance" }
uf-product-macros = { path = "uf-product-macros" }
uf-search-core = { path = "uf-search-core" }
# `default-features = false` must live here: member crates' `default-features = false`
# is ignored by Cargo when the workspace dependency omits it (lazy-routes would leak
# into uf-product-ui-e2e and break single-WASM hydrate).
uf-apps = { path = "uf-apps", default-features = false }
uf-welcome = { path = "uf-welcome", default-features = false }
uf-component-preview = { path = "uf-component-preview" }
# UI / styling
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
turf = "0.10"
# leptos-lints nightly-2025-05-14 fails on crc32fast 1.5.1 (unstable avx512 features).
crc32fast = "=1.5.0"
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["HtmlElement", "DomRect", "Element", "Node", "Document"] }

# Server / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8.4"
axum-login = "0.18.0"
tower-sessions = "0.14.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde", "wasmbind"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
dashmap = "5"
log = "0.4"

[[workspace.metadata.leptos]]
name = "shell-chrome-host"
output-name = "shell-chrome-host"
bin-package = "shell-chrome-host"
lib-package = "shell-chrome-host"
site-root = "examples/shell-chrome-host/site"
site-pkg-dir = "pkg"
style-file = "examples/shell-chrome-host/style/main.scss"
assets-dir = "examples/shell-chrome-host/public"
site-addr = "127.0.0.1:3040"
reload-port = 3041
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
# Avoid cargo-leptos RUSTFLAGS overwrite / erase_components skew with leptos 0.8.20
disable-erase-components = true

[[workspace.metadata.leptos]]
name = "component-preview-host"
output-name = "component-preview-host"
bin-package = "component-preview-host"
lib-package = "component-preview-host"
site-root = "examples/component-preview-host/site"
site-pkg-dir = "pkg"
style-file = "examples/component-preview-host/style/main.scss"
site-addr = "127.0.0.1:3042"
reload-port = 3043
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
disable-erase-components = true

[[workspace.metadata.leptos]]
name = "uf-product-ui-e2e"
output-name = "uf-product-ui-e2e"
bin-package = "uf-product-ui-e2e"
lib-package = "uf-product-ui-e2e"
site-root = "uf-product-ui-e2e/site"
site-pkg-dir = "pkg"
style-file = "uf-product-ui-e2e/style/main.scss"
assets-dir = "uf-product-ui-e2e/public"
end2end-dir = "uf-product-ui-e2e/end2end"
end2end-cmd = "npm test"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
disable-erase-components = true

# When developing this repo, redirect self-git consumers to local members.
[patch."https://github.com/deathbreakfast/unified-field-product"]
uf-product = { path = "uf-product" }
uf-integrations = { path = "uf-integrations" }
uf-product-macros = { path = "uf-product-macros" }
uf-search-core = { path = "uf-search-core" }

[patch."https://github.com/unified-field-dev/valence"]
uf-valence = { path = "../../L0-upstream-cores/valence/valence" }
uf-valence-core = { path = "../../L0-upstream-cores/valence/valence-core" }
uf-valence-codegen = { path = "../../L0-upstream-cores/valence/valence-codegen" }
uf-valence-macros = { path = "../../L0-upstream-cores/valence/valence-macros" }
uf-valence-telemetry = { path = "../../L0-upstream-cores/valence/valence-telemetry" }
uf-valence-backend-mem = { path = "../../L0-upstream-cores/valence/valence-backend-mem" }
uf-valence-backend-sqlite = { path = "../../L0-upstream-cores/valence/valence-backend-sqlite" }
uf-valence-backend-sql = { path = "../../L0-upstream-cores/valence/valence-backend-sql" }
uf-valence-schema-dsl = { path = "../../L0-upstream-cores/valence/valence-schema-dsl" }

# Operator: override crates.io Orbital with local L0 checkout
[patch.crates-io]
uf-valence = { path = "../../L0-upstream-cores/valence/valence" }
uf-valence-core = { path = "../../L0-upstream-cores/valence/valence-core" }
uf-valence-codegen = { path = "../../L0-upstream-cores/valence/valence-codegen" }
uf-valence-macros = { path = "../../L0-upstream-cores/valence/valence-macros" }
uf-valence-telemetry = { path = "../../L0-upstream-cores/valence/valence-telemetry" }
uf-valence-backend-mem = { path = "../../L0-upstream-cores/valence/valence-backend-mem" }
uf-valence-backend-sqlite = { path = "../../L0-upstream-cores/valence/valence-backend-sqlite" }
uf-valence-backend-sql = { path = "../../L0-upstream-cores/valence/valence-backend-sql" }
uf-valence-schema-dsl = { path = "../../L0-upstream-cores/valence/valence-schema-dsl" }
orbital-ui = { path = "../../L0-upstream-cores/orbital/orbital" }
orbital-macros = { path = "../../L0-upstream-cores/orbital/orbital-macros" }
orbital-shell = { path = "../../L0-upstream-cores/orbital/orbital-shell" }
orbital-core-components = { path = "../../L0-upstream-cores/orbital/orbital-core-components" }
orbital-base-components = { path = "../../L0-upstream-cores/orbital/orbital-base-components" }
orbital-primitives = { path = "../../L0-upstream-cores/orbital/orbital-primitives" }
orbital-theme = { path = "../../L0-upstream-cores/orbital/orbital-theme" }
orbital-paging = { path = "../../L0-upstream-cores/orbital/orbital-paging" }
orbital-datatable = { path = "../../L0-upstream-cores/orbital/orbital-datatable" }
orbital-date-pickers = { path = "../../L0-upstream-cores/orbital/orbital-date-pickers" }
orbital-charts = { path = "../../L0-upstream-cores/orbital/orbital-charts" }
orbital-tree = { path = "../../L0-upstream-cores/orbital/orbital-tree" }
orbital-scheduler = { path = "../../L0-upstream-cores/orbital/orbital-scheduler" }
orbital-motion = { path = "../../L0-upstream-cores/orbital/orbital-motion" }
orbital-style = { path = "../../L0-upstream-cores/orbital/orbital-style" }
orbital-data = { path = "../../L0-upstream-cores/orbital/orbital-data" }
